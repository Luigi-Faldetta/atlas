# Project Atlas - Docker Compose Configuration
# This orchestrates all backend services for the 2-developer team

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - atlas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Service
  backend:
    build: ./backend
    container_name: atlas-backend
    environment:
      DATABASE_URL: postgresql://atlas_user:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/atlas
      NODE_ENV: development
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - atlas-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

  # AI Agent Service (Web Scraping & AI Processing)
  ai-agent:
    build: .
    container_name: atlas-ai-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SCRAPINGBEE_API_KEY: ${SCRAPINGBEE_API_KEY}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - atlas-network
    restart: unless-stopped
    volumes:
      - ./ai_agent:/app
      - /app/node_modules
      - ./ai_agent/data:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    shm_size: 2gb  # Required for Playwright browsers

  # MCP Server
  mcp-server:
    build: ./mcp-server
    container_name: atlas-mcp-server
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - atlas-network
    restart: unless-stopped

  # Express Proxy Server
  express-proxy:
    build: ./express-server
    container_name: atlas-express-proxy
    environment:
      AI_AGENT_URL: http://ai-agent:8000
      NODE_ENV: production
      PORT: 5001
    ports:
      - "5001:5001"
    networks:
      - atlas-network
    restart: unless-stopped
    depends_on:
      - ai-agent

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: atlas-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - atlas-network
    depends_on:
      - backend
      - ai-agent
      - mcp-server
      - express-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - production  # Only start with --profile production

volumes:
  postgres_data:
    driver: local

networks:
  atlas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 